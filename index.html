<script>
  // Storage collegato al Google Sheet condiviso, tramite Apps Script.
  // URL fisso: nessuna configurazione richiesta a chi apre la pagina.
  const apiUrl = "https://script.google.com/macros/s/AKfycbx3Hx1nbXYzguaKPdTCgVpIlTSurwc-zMTZx9upl2pRZLcUaKWFJLxOXLrKX7BMumxRsw/exec";

  window.storage = {
    get: async function (key) {
      try {
        const res = await fetch(apiUrl + "?key=" + encodeURIComponent(key));
        const data = await res.json();
        if (data.value === null || data.value === undefined) return null;
        return { key: key, value: data.value };
      } catch (e) {
        console.error("storage.get failed", key, e);
        return null;
      }
    },
    set: async function (key, value) {
      try {
        await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ key: key, value: value }),
        });
        return { key: key, value: value };
      } catch (e) {
        console.error("storage.set failed", key, e);
        return null;
      }
    },
  };
</script>

function buildRounds() {
  const rounds = [];
  RAW_ROUNDS.forEach((r) => {
    rounds.push({
      key: `${r.g}A`, giornata: r.g, half: "andata", data: r.andata,
      matches: r.pairs.map(([h, a], idx) => ({
        id: `${r.g}A-${idx}`, home: NAME_MAP[h], away: NAME_MAP[a],
      })),
    });
    rounds.push({
      key: `${r.g}R`, giornata: r.g, half: "ritorno", data: r.ritorno,
      matches: r.pairs.map(([h, a], idx) => ({
        id: `${r.g}R-${idx}`, home: NAME_MAP[a], away: NAME_MAP[h],
      })),
    });
  });
  rounds.sort((x, y) => x.data.localeCompare(y.data));
  return rounds;
}

      const ga = parseInt(res.golAway, 10);
      if (isNaN(gh) || isNaN(ga)) return;
      const h = table[fx.home], a = table[fx.away];
      h.pg++; a.pg++; h.gf += gh; h.gs += ga; a.gf += ga; a.gs += gh;
      if (gh > ga) { h.v++; h.pt += 3; a.p++; }
      else if (gh < ga) { a.v++; a.pt += 3; h.p++; }
      else { h.n++; a.n++; h.pt += 1; a.pt += 1; }
    });
    return Object.values(table).sort((x, y) => {
      if (y.pt !== x.pt) return y.pt - x.pt;

        if (!byDate[e.date]) byDate[e.date] = { date: e.date };
        const key = `${e.date}|${p.name}`;
        if (byDate[e.date][p.name] === undefined) {
          byDate[e.date][p.name] = voto;
          counts[key] = 1;
        } else {
          // Media se più autori hanno votato lo stesso giocatore nella stessa data
          const n = counts[key];
          byDate[e.date][p.name] = (byDate[e.date][p.name] * n + voto) / (n + 1);
          counts[key] = n + 1;
        }

  function toggleConvocato(fixtureId, playerId) {
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      const convocati = { ...(cur.convocati || {}) };
      const titolari = { ...(cur.titolari || {}) };

        delete convocati[playerId];
        delete titolari[playerId];

      return { ...prev, [fixtureId]: { ...cur, convocati, titolari, sostituzioni } };
    });

          </span>

            <span style={{ width: 10, height: 10, borderRadius: "50%", background: SUB_COLOR, display: "inline-block" }} /> Subentrato
          </span>
        </div>
        <div style={{
          position: "relative", width: "100%", maxWidth: 320, aspectRatio: "2 / 3", margin: "0 auto",
          background: "linear-gradient(180deg, #3f9142 0%, #368239 100%)", borderRadius: 8, border: `2px solid #2c6b2f`, overflow: "hidden",
        }}>
          {/* linee di campo */}
          <div style={{ position: "absolute", left: "10%", right: "10%", top: "50%", height: 1, background: "rgba(255,255,255,0.5)" }} />
          <div style={{ position: "absolute", left: "50%", top: "50%", width: 60, height: 60, border: "1px solid rgba(255,255,255,0.5)", borderRadius: "50%", transform: "translate(-50%,-50%)" }} />
          <div style={{ position: "absolute", left: "25%", right: "25%", bottom: 0, height: "14%", border: "1px solid rgba(255,255,255,0.5)", borderTop: "none" }} />
          <div style={{ position: "absolute", left: "25%", right: "25%", top: 0, height: "14%", border: "1px solid rgba(255,255,255,0.5)", borderBottom: "none" }} />
          {slots.map((slot) => {
            const playerId = typeof formazione[slot.id] === "string" ? formazione[slot.id] : (formazione[slot.id] && formazione[slot.id].titolare) || "";
            const player = roster.find((r) => r.id === playerId);
            const sub = sostituzioni.find((s) => s.out === playerId);
            const subPlayer = sub ? roster.find((r) => r.id === sub.in) : null;
            return (
              <div key={slot.id} style={{ position: "absolute", left: `${slot.x}%`, top: `${slot.y}%`, transform: "translate(-50%,-50%)", textAlign: "center" }}>
                <select value={playerId} onChange={(e) => onChangeSlot(slot.id, e.target.value)}
                  style={{
                    width: 44, height: 44, borderRadius: "50%", border: `2px solid ${player ? "#fff" : "rgba(255,255,255,0.6)"}`,
                    background: player ? RED : "rgba(255,255,255,0.15)", color: "#fff", fontSize: 10, fontWeight: 700,
                    textAlign: "center", textAlignLast: "center", cursor: "pointer", appearance: "none", padding: 0,
                  }}>
                  <option value="" style={{ color: INK }}>{slot.label}</option>
                  {titolariRoster.map((rp) => (
                    <option key={rp.id} value={rp.id} style={{ color: INK }}>{rp.nome}</option>
                  ))}
                </select>
                {player && (
                  <div style={{ fontSize: 9, color: "#fff", marginTop: 2, maxWidth: 62, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {player.nome.split(" ")[0]}
                  </div>
                )}
                {subPlayer && (
                  <div style={{ fontSize: 9, color: SUB_COLOR, background: "#fff", borderRadius: 6, padding: "0 4px", marginTop: 2, fontWeight: 700, maxWidth: 68, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    ⇄ {subPlayer.nome.split(" ")[0]}{sub.minuto ? ` ${sub.minuto}'` : ""}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // --- ROSA SQUADRA ---
  function addRosterPlayer() {
    if (!rosterDraft.nome) return;
    setRoster((prev) => [...prev, { id: Date.now().toString(), nome: rosterDraft.nome }]);
    setRosterDraft({ nome: "" });
  }

  function removeRosterPlayer(id) {
    setRoster((prev) => prev.filter((p) => p.id !== id));
  }

  function startEditRoster(p) {
    setEditingRosterId(p.id);
    setRosterDraft({ nome: p.nome });
  }

  function saveEditRoster(id) {
    if (!rosterDraft.nome) return;
    setRoster((prev) => prev.map((p) => (p.id === id ? { ...p, nome: rosterDraft.nome } : p)));
    setEditingRosterId(null);
    setRosterDraft({ nome: "" });
  }



  function addTeamVoto(fixtureId) {
    const d = teamVotoDraft[fixtureId];
    if (!voterName || !d || !d.voto) return;
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      const list = cur.votoSquadra || [];
      return { ...prev, [fixtureId]: { ...cur, votoSquadra: [...list, { id: Date.now().toString(), autore: voterName, voto: d.voto, nota: d.nota || "" }] } };
    });
    setTeamVotoDraft((prev) => ({ ...prev, [fixtureId]: { voto: "", nota: "" } }));
  }

  function removeTeamVoto(fixtureId, id) {
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      return { ...prev, [fixtureId]: { ...cur, votoSquadra: (cur.votoSquadra || []).filter((v) => v.id !== id) } };
    });
  }

  function startEditTeamVoto(fixtureId, v) {
    setEditingTeamVoto(`${fixtureId}:${v.id}`);
    setTeamVotoDraft((prev) => ({ ...prev, [`edit-${fixtureId}`]: { voto: v.voto, nota: v.nota || "" } }));
  }

  function saveEditTeamVoto(fixtureId, id) {
    const d = teamVotoDraft[`edit-${fixtureId}`];
    if (!d || !d.voto) return;
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      const list = (cur.votoSquadra || []).map((v) => (v.id === id ? { ...v, voto: d.voto, nota: d.nota || "" } : v));
      return { ...prev, [fixtureId]: { ...cur, votoSquadra: list } };
    });
    setEditingTeamVoto(null);
  }

  function addTeamVotoF(friendlyId) {
    const d = teamVotoDraftF[friendlyId];
    if (!voterName || !d || !d.voto) return;
    setFriendlyTeamVoto((prev) => {
      const list = prev[friendlyId] || [];
      return { ...prev, [friendlyId]: [...list, { id: Date.now().toString(), autore: voterName, voto: d.voto, nota: d.nota || "" }] };
    });
    setTeamVotoDraftF((prev) => ({ ...prev, [friendlyId]: { voto: "", nota: "" } }));
  }

  function removeTeamVotoF(friendlyId, id) {
    setFriendlyTeamVoto((prev) => ({ ...prev, [friendlyId]: (prev[friendlyId] || []).filter((v) => v.id !== id) }));
  }

  function startEditTeamVotoF(friendlyId, v) {
    setEditingTeamVotoF(`${friendlyId}:${v.id}`);
    setTeamVotoDraftF((prev) => ({ ...prev, [`edit-${friendlyId}`]: { voto: v.voto, nota: v.nota || "" } }));
  }

  function saveEditTeamVotoF(friendlyId, id) {
    const d = teamVotoDraftF[`edit-${friendlyId}`];
    if (!d || !d.voto) return;
    setFriendlyTeamVoto((prev) => ({
      ...prev,
      [friendlyId]: (prev[friendlyId] || []).map((v) => (v.id === id ? { ...v, voto: d.voto, nota: d.nota || "" } : v)),
    }));
    setEditingTeamVotoF(null);
  }

  function renderCampionatoRow(fx, metaLabel, statusColor) {
    const played = results[fx.id];
    const d = draft[fx.id] || {};
    const isCimianoMatch = fx.home === CIMIANO || fx.away === CIMIANO;
    const isOpen = !!expanded[fx.id];
    const sd = scorerDraft[fx.id] || {};
    const rd = ratingDraft[fx.id] || {};
    const marcatori = (detailsShared[fx.id] && detailsShared[fx.id].marcatori) || [];
    const voti = (detailsShared[fx.id] && detailsShared[fx.id].voti) || [];
    const votoSquadraList = (detailsShared[fx.id] && detailsShared[fx.id].votoSquadra) || [];
    const convocati = (detailsShared[fx.id] && detailsShared[fx.id].convocati) || {};
    const titolari = (detailsShared[fx.id] && detailsShared[fx.id].titolari) || {};
    const sostituzioni = (detailsShared[fx.id] && detailsShared[fx.id].sostituzioni) || [];
    const convocatiIds = Object.keys(convocati);
    const titolariIds = Object.keys(titolari).filter((id) => convocatiIds.includes(id));
    const panchinaIds = convocatiIds.filter((id) => !titolari[id]);
    const gia_subentrati = sostituzioni.map((s) => s.in);
    const tvd = teamVotoDraft[fx.id] || {};
    const sc = statusColor ? STATUS_COLORS[statusColor] : null;
    const rowBg = sc ? sc.bg : (isCimianoMatch ? "#fdeceb" : "#fff");
    const rowBorder = sc ? sc.border : LINE;
    return (
      <div key={fx.id} style={{ background: rowBg, border: `1px solid ${rowBorder}`, borderRadius: 4, fontSize: 13 }}>
        {metaLabel && (
          <div style={{ fontSize: 11, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, padding: "6px 12px 0" }}>{metaLabel}</div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 84px minmax(0,1fr) auto", alignItems: "center", columnGap: 10, padding: metaLabel ? "4px 12px 8px" : "8px 12px" }}>
          <span style={{ fontWeight: fx.home === CIMIANO ? 700 : 400, color: fx.home === CIMIANO ? RED : INK, textAlign: "right", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fx.home}</span>
          {played ? (
            <span style={{ fontWeight: 700, textAlign: "center" }}>{played.golHome} – {played.golAway}</span>
          ) : (
            <span style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
              <input className="score-input" type="number" min="0" value={d.golHome ?? ""}
                onChange={(e) => setDraft((p) => ({ ...p, [fx.id]: { ...p[fx.id], golHome: e.target.value } }))} />
              <span style={{ color: MUTED }}>–</span>
              <input className="score-input" type="number" min="0" value={d.golAway ?? ""}
                onChange={(e) => setDraft((p) => ({ ...p, [fx.id]: { ...p[fx.id], golAway: e.target.value } }))} />
            </span>
          )}
          <span style={{ fontWeight: fx.away === CIMIANO ? 700 : 400, color: fx.away === CIMIANO ? RED : INK, textAlign: "left", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fx.away}</span>
          <div style={{ display: "flex", gap: 10, alignItems: "center", justifySelf: "end" }}>
            {played && isCimianoMatch && (
              <button onClick={() => setExpanded((p) => ({ ...p, [fx.id]: !p[fx.id] }))}
                style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                {isOpen ? "chiudi dettagli" : "marcatori & voti"}
              </button>
            )}
            {played ? (
              <button onClick={() => clearResult(fx.id)} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer", fontSize: 12 }}>modifica</button>
            ) : (
              <button onClick={() => saveResult(fx.id)} style={{ background: RED, color: "#fff", border: "none", padding: "5px 12px", borderRadius: 3, fontWeight: 600, cursor: "pointer", fontSize: 12 }}>Salva</button>
            )}
          </div>
        </div>

        {isOpen && played && isCimianoMatch && (
          <div style={{ borderTop: `1px solid ${LINE}`, padding: "10px 12px", background: "#fff" }}>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                <span>
                  Voto Squadra {votoSquadraList.length > 0 && `— media ${(votoSquadraList.reduce((s, v) => s + parseFloat(v.voto), 0) / votoSquadraList.length).toFixed(1)} (${votoSquadraList.length})`}
                </span>
                {Array.from(new Set(votoSquadraList.map((v) => v.autore))).length > 1 && (
                  <select value={teamVoteFilter[fx.id] || ""} onChange={(e) => setTeamVoteFilter((p) => ({ ...p, [fx.id]: e.target.value }))}
                    style={{ fontSize: 11, padding: "2px 4px", border: `1px solid ${LINE}`, borderRadius: 3, textTransform: "none", fontWeight: 400 }}>
                    <option value="">Tutti</option>
                    {Array.from(new Set(votoSquadraList.map((v) => v.autore))).map((a) => (
                      <option key={a} value={a}>{a}</option>
                    ))}
                  </select>
                )}
              </div>
              {votoSquadraList.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 }}>
                  {votoSquadraList.filter((v) => !teamVoteFilter[fx.id] || v.autore === teamVoteFilter[fx.id]).map((v) => {
                    const isEditingV = editingTeamVoto === `${fx.id}:${v.id}`;
                    const ed = teamVotoDraft[`edit-${fx.id}`] || {};
                    return isEditingV ? (
                      <div key={v.id} style={{ display: "flex", gap: 6, alignItems: "center", background: TEAM_BOX_BG, border: `1px solid ${TEAM_BOX_BORDER}`, borderRadius: 6, padding: 8 }}>
                        <input type="number" min="1" max="10" step="0.5" placeholder="Voto" value={ed.voto || ""} onChange={(e) => setTeamVotoDraft((p) => ({ ...p, [`edit-${fx.id}`]: { ...p[`edit-${fx.id}`], voto: e.target.value } }))}
                          style={{ width: 55, padding: 6, border: `1px solid ${LINE}`, borderRadius: 3 }} />
                        <input placeholder="Nota" value={ed.nota || ""} onChange={(e) => setTeamVotoDraft((p) => ({ ...p, [`edit-${fx.id}`]: { ...p[`edit-${fx.id}`], nota: e.target.value } }))}
                          style={{ flex: 1, padding: 6, border: `1px solid ${LINE}`, borderRadius: 3 }} />
                        <button onClick={() => saveEditTeamVoto(fx.id, v.id)} style={{ background: RED, color: "#fff", border: "none", padding: "6px 14px", borderRadius: 3, fontWeight: 600, cursor: "pointer" }}>Salva</button>
                        <button onClick={() => setEditingTeamVoto(null)} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer" }}>annulla</button>
                      </div>
                    ) : (
                      <div key={v.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", background: TEAM_BOX_BG, border: `1px solid ${TEAM_BOX_BORDER}`, borderRadius: 6, padding: "8px 10px", gap: 8 }}>
                        <div>
                          <div><strong>{v.voto}</strong>{v.nota ? ` · ${v.nota}` : ""}</div>
                          <span style={{ display: "inline-block", marginTop: 4, fontSize: 10, background: AUTHOR_BADGE_BG, color: AUTHOR_BADGE_TEXT, padding: "1px 7px", borderRadius: 8 }}>{v.autore}</span>
                        </div>
                        <span style={{ display: "flex", gap: 8, flexShrink: 0 }}>
                          <button onClick={() => startEditTeamVoto(fx.id, v)} style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12 }}>modifica</button>
                          <button onClick={() => removeTeamVoto(fx.id, v.id)} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer" }}>×</button>
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                <input type="number" min="1" max="10" step="0.5" placeholder="Voto" value={tvd.voto || ""} onChange={(e) => setTeamVotoDraft((p) => ({ ...p, [fx.id]: { ...p[fx.id], voto: e.target.value } }))}
                  style={{ width: 55, padding: 6, border: `1px solid ${LINE}`, borderRadius: 3 }} />
                <input placeholder="Nota (opz.)" value={tvd.nota || ""} onChange={(e) => setTeamVotoDraft((p) => ({ ...p, [fx.id]: { ...p[fx.id], nota: e.target.value } }))}
                  style={{ flex: 1, padding: 6, border: `1px solid ${LINE}`, borderRadius: 3 }} />
                <button onClick={() => addTeamVoto(fx.id)} disabled={!voterName} style={{ background: voterName ? RED : "#ccc", color: "#fff", border: "none", padding: "6px 14px", borderRadius: 3, fontWeight: 600, cursor: voterName ? "pointer" : "not-allowed" }}>+</button>
              </div>
              {!voterName && <div style={{ fontSize: 11, color: RED, marginTop: 4 }}>Seleziona chi sei in alto (sotto il logo) per poter votare.</div>}
            </div>

            {roster.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>
                  1. Convocati {convocatiIds.length > 0 && `(${convocatiIds.length})`}
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {roster.map((rp) => (
                    <button key={rp.id} onClick={() => toggleConvocato(fx.id, rp.id)}
                      style={{ fontSize: 12, padding: "4px 10px", borderRadius: 12, border: `1px solid ${LINE}`, background: convocati[rp.id] ? RED : "#fff", color: convocati[rp.id] ? "#fff" : INK, cursor: "pointer" }}>
                      {rp.nome}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {convocatiIds.length > 0 && (
              <div style={{ marginBottom: 14 }}>

                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {roster.filter((rp) => convocati[rp.id]).map((rp) => (
                    <div key={rp.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 6 }}>

                      <span style={{ display: "flex", gap: 4 }}>
                        <button onClick={() => setRuolo(fx.id, rp.id, "titolare")}
                          style={{ fontSize: 11, padding: "3px 9px", borderRadius: 8, border: `1px solid ${LINE}`, background: titolari[rp.id] ? RED : "#fff", color: titolari[rp.id] ? "#fff" : MUTED, cursor: "pointer" }}>Titolare</button>
                        <button onClick={() => setRuolo(fx.id, rp.id, "panchina")}
                          style={{ fontSize: 11, padding: "3px 9px", borderRadius: 8, border: `1px solid ${LINE}`, background: !titolari[rp.id] ? RED : "#fff", color: !titolari[rp.id] ? "#fff" : MUTED, cursor: "pointer" }}>Panchina</button>
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {titolariIds.length > 0 && (

                  <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 }}>

                      const inP = roster.find((r) => r.id === s.in);

                          <span>{s.minuto ? `${s.minuto}' — ` : ""}esce <strong>{outP ? outP.nome : "?"}</strong>, entra <strong style={{ color: SUB_COLOR }}>{inP ? inP.nome : "?"}</strong></span>
                          <button onClick={() => removeSostituzione(fx.id, s.id)} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer", fontSize: 15 }}>×</button>

                  </div>

                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>

                    </select>
                    <select value={(subDraft[fx.id] && subDraft[fx.id].in) || ""} onChange={(e) => setSubDraft((p) => ({ ...p, [fx.id]: { ...p[fx.id], in: e.target.value } }))}
                      style={{ fontSize: 12, padding: 5, border: `1px solid ${LINE}`, borderRadius: 3 }}>
                      <option value="">Entra...</option>
                      {roster.filter((r) => panchinaIds.includes(r.id) && !gia_subentrati.includes(r.id)).map((r) => <option key={r.id} value={r.id}>{r.nome}</option>)}

                      style={{ width: 50, fontSize: 12, padding: 5, border: `1px solid ${LINE}`, borderRadius: 3 }} />
                    <button onClick={() => { const d = subDraft[fx.id] || {}; addSostituzione(fx.id, d.out, d.in, d.minuto); setSubDraft((p) => ({ ...p, [fx.id]: { out: "", in: "", minuto: "" } })); }}

            {titolariIds.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>4. Formazione</div>
                {renderPitch(
                  (detailsShared[fx.id] && detailsShared[fx.id].formazione) || {},
                  (slotId, playerId) => setFormazione(fx.id, slotId, playerId),
                  (detailsShared[fx.id] && detailsShared[fx.id].modulo) || DEFAULT_MODULO,

                        <input placeholder="Min." value={ed.minuto || ""} onChange={(e) => setScorerDraft((p) => ({ ...p, [`edit-${fx.id}`]: { ...p[`edit-${fx.id}`], minuto: e.target.value } }))}

                style={{ width: 100, padding: 6, border: `1px solid ${LINE}` }} />
              <span style={{ alignSelf: "center", color: MUTED }}>–</span>
              <input type="number" placeholder="Gol avv." value={fForm.golAvv} onChange={(e) => setFForm({ ...fForm, golAvv: e.target.value })}
                style={{ width: 90, padding: 6, border: `1px solid ${LINE}` }} />
              <button onClick={addFriendly} style={{ background: RED, color: "#fff", border: "none", padding: "6px 16px", borderRadius: 3, fontWeight: 600, cursor: "pointer" }}>
                Aggiungi
              </button>
            </div>
            <div style={{ fontSize: 11, color: MUTED, marginBottom: 20 }}>
              Se la partita non si è ancora giocata, lascia vuoti i gol: comparirà come "in programma" e potrai aggiungere il risultato dopo.
            </div>

            <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
              Tutte le partite
            </div>
            <div style={{ display: "flex", gap: 14, marginBottom: 10, fontSize: 11, color: MUTED, flexWrap: "wrap" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: STATUS_COLORS.played.bg, border: `1px solid ${STATUS_COLORS.played.border}`, display: "inline-block" }} /> giocata
              </span>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: STATUS_COLORS.next.bg, border: `1px solid ${STATUS_COLORS.next.border}`, display: "inline-block" }} /> prossima
              </span>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: STATUS_COLORS.upcoming.bg, border: `1px solid ${STATUS_COLORS.upcoming.border}`, display: "inline-block" }} /> in programma
              </span>
            </div>
            {allCimianoMatches.length === 0 ? (
              <div style={{ color: MUTED, fontSize: 13 }}>Nessuna partita registrata per il Cimiano al momento.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {(() => {
                  let nextAssigned = false;
                  return allCimianoMatches.map((m) => {
                    let isPlayed;
                    if (m.type === "amichevole") {
                      const f = friendlies.find((fr) => fr.id === m.id);
                      isPlayed = f ? (f.golCimiano !== "" && f.golCimiano !== undefined && f.golAvv !== "" && f.golAvv !== undefined) : false;
                    } else {
                      isPlayed = !!results[m.id];
                    }
                    let statusColor;
                    if (isPlayed) {
                      statusColor = "played";
                    } else if (!nextAssigned) {
                      statusColor = "next";
                      nextAssigned = true;
                    } else {
                      statusColor = "upcoming";
                    }

                    if (m.type === "amichevole") {
                      const f = friendlies.find((fr) => fr.id === m.id);
                      return f ? renderFriendlyRow(f, statusColor) : null;
                    }
                    const label = m.type === "coppa"
                      ? `Coppa Lombardia · Girone ${COPPA_GIRONE} · ${fmtDate(m.date)}`
                      : `Campionato · G${m.giornata} ${m.half === "andata" ? "A" : "R"} · ${fmtDate(m.date)}`;
                    return renderCampionatoRow(
                      { id: m.id, home: m.home, away: m.away },
                      label,
                      statusColor
                    );
                  });
                })()}
              </div>
            )}
          </div>
        )}

        {macroTab === "stagione" && stagSub === "giocatori" && (
          <div className="body-font">
            {chartData.length > 1 && (
              <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 4, padding: "12px 8px 4px", marginBottom: 16 }}>
                <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8, paddingLeft: 8 }}>
                  Andamento voti
                </div>
                <ResponsiveContainer width="100%" height={220}>
                  <LineChart data={chartData} margin={{ top: 5, right: 12, left: -18, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={LINE} />
                    <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: MUTED }} />
                    <YAxis domain={[1, 10]} tick={{ fontSize: 11, fill: MUTED }} />
                    <Tooltip labelFormatter={fmtDate} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                    {playersWithData.map((p, i) => (
                      <Line key={p.name} type="monotone" dataKey={p.name} stroke={PLAYER_COLORS[i % PLAYER_COLORS.length]}
                        strokeWidth={2} connectNulls dot={{ r: 3 }} activeDot={{ r: 5 }} />
                    ))}
                  </LineChart>
                </ResponsiveContainer>
              </div>
            )}

            <div style={{ fontSize: 12, color: MUTED, marginBottom: 16 }}>
              Storico voti, minutaggio e commenti per giocatore, dalla partita più recente alla più vecchia.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {playerStats.map((p) => {
                const isOpen = !!expandedPlayer[p.name];
                return (
                  <div key={p.name} style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 4, fontSize: 13 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", flexWrap: "wrap", gap: 6 }}>
                      <div>
                        <strong style={{ fontSize: 15 }}>{p.name}</strong>
                        <div style={{ color: MUTED, fontSize: 12, marginTop: 2 }}>
                          {p.presenze} {p.presenze === 1 ? "presenza" : "presenze"}
                          {p.media !== null && ` · media voto ${p.media.toFixed(1)}`}
                          {p.minutiTot !== null && ` · ${p.minutiTot}' totali`}
                        </div>
                      </div>
                      {p.entries.length > 0 && (
                        <button onClick={() => setExpandedPlayer((prev) => ({ ...prev, [p.name]: !prev[p.name] }))}
                          style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                          {isOpen ? "chiudi storico" : "vedi storico"}
                        </button>
                      )}
                    </div>

                    {isOpen && (
                      <div style={{ borderTop: `1px solid ${LINE}`, padding: "10px 12px" }}>
                        {(() => {
                          const byDate = {};
                          p.entries.forEach((e) => {
                            const voto = parseFloat(e.voto);
                            if (isNaN(voto) || !e.date || e.date === "0000-00-00") return;
                            if (!byDate[e.date]) byDate[e.date] = { sum: 0, count: 0 };
                            byDate[e.date].sum += voto;
                            byDate[e.date].count += 1;
                          });
                          const playerChartData = Object.keys(byDate)
                            .sort((a, b) => a.localeCompare(b))
                            .map((date) => ({ date, voto: byDate[date].sum / byDate[date].count }));
                          if (playerChartData.length < 2) return null;
                          return (
                            <div style={{ marginBottom: 14 }}>
                              <ResponsiveContainer width="100%" height={140}>
                                <LineChart data={playerChartData} margin={{ top: 5, right: 12, left: -28, bottom: 5 }}>
                                  <CartesianGrid strokeDasharray="3 3" stroke={LINE} />
                                  <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 10, fill: MUTED }} />
                                  <YAxis domain={[1, 10]} tick={{ fontSize: 10, fill: MUTED }} />
                                  <Tooltip labelFormatter={fmtDate} formatter={(v) => [v.toFixed(1), "Voto"]} />
                                  <Line type="monotone" dataKey="voto" stroke={RED} strokeWidth={2} dot={{ r: 3 }} activeDot={{ r: 5 }} />
                                </LineChart>
                              </ResponsiveContainer>
                            </div>
                          );
                        })()}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                          {p.entries.map((e, i) => (
                            <div key={i} style={{ borderBottom: i < p.entries.length - 1 ? `1px solid ${LINE}` : "none", paddingBottom: 8 }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
                                <span>
                                  <span style={{ fontSize: 11, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginRight: 6 }}>
                                    {e.tipo === "campionato" ? `G${e.giornata} ${e.half === "andata" ? "A" : "R"}` : "Amichevole"}
                                  </span>
                                  vs <strong>{e.opponent}</strong>
                                  <span style={{ color: MUTED, marginLeft: 6 }}>{e.date && e.date !== "0000-00-00" ? fmtDate(e.date) : ""}</span>
                                </span>
                                <span style={{ fontWeight: 700 }}>
                                  {e.voto}{e.minutaggio ? ` · ${e.minutaggio}'` : ""}
                                </span>
                              </div>
                              {e.nota && <div style={{ color: MUTED, fontSize: 12, fontStyle: "italic", marginTop: 2 }}>{e.nota}</div>}
                              {e.autore && <div style={{ color: MUTED, fontSize: 11, marginTop: 2 }}>votato da {e.autore}</div>}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {macroTab === "stagione" && stagSub === "cannonieri" && (
          <div className="body-font">
            <div style={{ fontSize: 12, color: MUTED, marginBottom: 16 }}>
              Gol segnati in tutte le competizioni: campionato, Coppa Lombardia e amichevoli.
            </div>
            {cannonieri.length === 0 ? (
              <div style={{ color: MUTED, fontSize: 13 }}>Nessun marcatore registrato ancora.</div>
            ) : (
              <table style={{ fontSize: 13, width: "100%" }}>
                <thead>
                  <tr style={{ color: MUTED, fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5 }}>
                    <th style={{ textAlign: "left" }}>#</th><th style={{ textAlign: "left" }}>Giocatore</th><th style={{ textAlign: "center" }}>Gol</th>
                  </tr>
                </thead>
                <tbody>
                  {cannonieri.map((c, i) => (
                    <tr key={c.name} style={{ borderBottom: `1px solid ${LINE}` }}>
                      <td style={{ padding: "8px 0" }}>{i + 1}</td>
                      <td style={{ padding: "8px 0", fontWeight: 600 }}>{c.name}</td>
                      <td style={{ padding: "8px 0", textAlign: "center", fontWeight: 700, color: RED }}>⚽ {c.gol}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        )}

        {macroTab === "stagione" && stagSub === "rosa" && (
          <div className="body-font">
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16, background: "#fff", padding: 12, borderRadius: 4, border: `1px solid ${LINE}` }}>
              <input placeholder="Nome giocatore" value={rosterDraft.nome} onChange={(e) => setRosterDraft((p) => ({ ...p, nome: e.target.value }))}
                style={{ flex: 1, minWidth: 140, padding: 6, border: `1px solid ${LINE}` }} />
              {editingRosterId ? (
                <>
                  <button onClick={() => saveEditRoster(editingRosterId)} style={{ background: RED, color: "#fff", border: "none", padding: "6px 16px", borderRadius: 3, fontWeight: 600, cursor: "pointer" }}>Salva</button>
                  <button onClick={() => { setEditingRosterId(null); setRosterDraft({ nome: "" }); }} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer" }}>annulla</button>
                </>
              ) : (
                <button onClick={addRosterPlayer} style={{ background: RED, color: "#fff", border: "none", padding: "6px 16px", borderRadius: 3, fontWeight: 600, cursor: "pointer" }}>Aggiungi</button>
              )}
            </div>
            <div style={{ fontSize: 11, color: MUTED, marginBottom: 16 }}>
              Tutto qui è condiviso: rosa, voti (con autore e media calcolata automaticamente), marcatori, presenze e formazioni. Chi usa questo tracker vede sempre gli stessi dati.
            </div>
            {roster.length === 0 ? (
              <div style={{ color: MUTED, fontSize: 13 }}>Nessun giocatore in rosa.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {roster.map((rp) => (
                  <div key={rp.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff", padding: "8px 12px", border: `1px solid ${LINE}`, borderRadius: 4, fontSize: 13 }}>
                    <span>{rp.nome}</span>
                    <span style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => startEditRoster(rp)} style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12 }}>modifica</button>
                      <button onClick={() => removeRosterPlayer(rp.id)} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer", fontSize: 16 }}>×</button>
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {macroTab === "campionato" && campSub === "risultati" && (
          <div className="body-font">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, gap: 8, flexWrap: "wrap" }}>
              <button onClick={() => setRoundIdx((i) => Math.max(0, i - 1))} disabled={roundIdx === 0}
                style={{ padding: "6px 12px", border: `1px solid ${LINE}`, background: "#fff", borderRadius: 3, cursor: "pointer" }}>‹ Prec.</button>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontWeight: 700, fontSize: 16 }}>Giornata {round.giornata} · {round.half === "andata" ? "Andata" : "Ritorno"}</div>
                <div style={{ fontSize: 12, color: MUTED }}>{fmtDate(round.data)}</div>
              </div>
              <button onClick={() => setRoundIdx((i) => Math.min(ROUNDS.length - 1, i + 1))} disabled={roundIdx === ROUNDS.length - 1}
                style={{ padding: "6px 12px", border: `1px solid ${LINE}`, background: "#fff", borderRadius: 3, cursor: "pointer" }}>Succ. ›</button>
            </div>

            <select value={roundIdx} onChange={(e) => setRoundIdx(Number(e.target.value))}
              style={{ width: "100%", padding: 6, border: `1px solid ${LINE}`, marginBottom: 14, borderRadius: 3 }}>
              {ROUNDS.map((r, i) => (
                <option key={r.key} value={i}>
                  Giornata {r.giornata} ({r.half === "andata" ? "A" : "R"}) — {fmtDate(r.data)}
                </option>
              ))}
            </select>

            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {round.matches.map((fx) => renderCampionatoRow(fx))}
            </div>
          </div>
        )}

        {macroTab === "coppa" && coppaSub === "classifica" && (
          <div className="body-font">
            <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
              Fase a gironi · Girone {COPPA_GIRONE} · 6-30 settembre 2026
            </div>
            <table style={{ fontSize: 13 }}>
              <thead>
                <tr style={{ color: MUTED, fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5 }}>
                  <th>#</th><th>Squadra</th><th style={{ textAlign: "center" }}>PG</th>
                  <th style={{ textAlign: "center" }}>V</th><th style={{ textAlign: "center" }}>N</th>
                  <th style={{ textAlign: "center" }}>P</th><th style={{ textAlign: "center" }}>GF</th>
                  <th style={{ textAlign: "center" }}>GS</th><th style={{ textAlign: "center" }}>DR</th>
                  <th style={{ textAlign: "center" }}>Pt</th>
                </tr>
              </thead>
              <tbody>
                {coppaStandings.map((s, i) => (
                  <tr key={s.name} style={{ background: s.name === CIMIANO ? "#fdeceb" : "transparent", fontWeight: s.name === CIMIANO ? 700 : 400 }}>
                    <td>{i + 1}</td>
                    <td style={{ color: s.name === CIMIANO ? RED : INK }}>{s.name}</td>
                    <td style={{ textAlign: "center" }}>{s.pg}</td>
                    <td style={{ textAlign: "center" }}>{s.v}</td>
                    <td style={{ textAlign: "center" }}>{s.n}</td>
                    <td style={{ textAlign: "center" }}>{s.p}</td>
                    <td style={{ textAlign: "center" }}>{s.gf}</td>
                    <td style={{ textAlign: "center" }}>{s.gs}</td>
                    <td style={{ textAlign: "center" }}>{s.gf - s.gs > 0 ? "+" : ""}{s.gf - s.gs}</td>
                    <td style={{ textAlign: "center", fontWeight: 700 }}>{s.pt}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {macroTab === "coppa" && coppaSub === "risultati" && (
          <div className="body-font">
            <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
              Fase a gironi · Girone {COPPA_GIRONE} · 6-30 settembre 2026
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {COPPA_FIXTURES.map((fx) => renderCampionatoRow(fx, `${fmtDate(fx.data)} ore ${fx.ora}`))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("app-root"));
root.render(<GironeATracker />);

</script>
</body>
</html>
