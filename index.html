<style>
  html, body { margin: 0; padding: 0; background: #f7f4ec; font-family: system-ui, sans-serif; }
  #app-root { max-width: 720px; margin: 0 auto; min-height: 100vh; }
  #loading { max-width: 720px; margin: 40px auto; padding: 20px; color: #6b6b63; text-align: center; }
  #save-error-banner { position: fixed; top: 0; left: 0; right: 0; background: #c8102e; color: #fff; padding: 10px 14px; text-align: center; font-family: system-ui, sans-serif; font-size: 13px; z-index: 9999; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  #save-error-banner button { margin-left: 10px; background: #fff; color: #c8102e; border: none; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-weight: 600; }
</style>

<body>

<div id="app-root"><div id="loading">Caricamento in corso…</div></div>

<script>
  // Storage collegato al Google Sheet condiviso, tramite Apps Script.
  // URL fisso: nessuna configurazione richiesta a chi apre la pagina.
  const apiUrl = "https://script.google.com/macros/s/AKfycbx3Hx1nbXYzguaKPdTCgVpIlTSurwc-zMTZx9upl2pRZLcUaKWFJLxOXLrKX7BMumxRsw/exec";

  // --- Retry automatico + avviso visibile in caso di salvataggio fallito ---
  async function fetchWithRetry(url, options, maxAttempts) {
    maxAttempts = maxAttempts || 3;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const res = await fetch(url, options);
        if (res && res.ok) return res;
      } catch (e) {
        console.warn("Tentativo " + attempt + " fallito:", e);
      }
      if (attempt < maxAttempts) {
        await new Promise((r) => setTimeout(r, 500 * attempt));
      }
    }
    return null;
  }

  function showSaveError(key) {
    let banner = document.getElementById("save-error-banner");
    if (banner) return;
    banner = document.createElement("div");
    banner.id = "save-error-banner";
    banner.innerHTML = "⚠️ Salvataggio non riuscito" + (key ? " (" + key + ")" : "") + ". Controlla la connessione e riprova l'operazione. <button id=\"save-error-dismiss\">OK</button>";
    document.body.appendChild(banner);
    document.getElementById("save-error-dismiss").onclick = function () { banner.remove(); };
  }

  // Fase 3: banner dedicato per un fallimento nel CARICAMENTO iniziale di Rosa/Amichevoli/Risultati
  // (diverso dal fallimento di un salvataggio): qui l'unica azione sensata è ricaricare la pagina,
  // MAI inventare dati di default al posto di quelli veri che non siamo riusciti a leggere.
  function showLoadError() {
    let banner = document.getElementById("load-error-banner");
    if (banner) return;
    banner = document.createElement("div");
    banner.id = "load-error-banner";
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a1e1e;color:#fff;padding:10px 16px;font-size:13px;text-align:center;";
    banner.innerHTML = "⚠️ Non sono riuscito a caricare Rosa/Amichevoli/Risultati (problema di connessione). Per sicurezza non ho mostrato dati inventati. <button id=\"load-error-retry\" style=\"margin-left:8px;padding:4px 12px;border-radius:4px;border:none;background:#fff;color:#7a1e1e;font-weight:700;cursor:pointer;\">Ricarica</button>";
    document.body.appendChild(banner);
    document.getElementById("load-error-retry").onclick = function () { window.location.reload(); };
  }

  window.storage = {
    get: async function (key) {
      const res = await fetchWithRetry(apiUrl + "?key=" + encodeURIComponent(key), {}, 2);
      if (!res) return null;
      try {
        const data = await res.json();
        if (data.value === null || data.value === undefined) return null;
        return { key: key, value: data.value };
      } catch (e) {
        return null;
      }
    },
    set: async function (key, value) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ key: key, value: value }),
      }, 3);
      if (!res) {
        showSaveError(key);
        return null;
      }
      try {
        const data = await res.json();
        if (data && data.ok) {
          return { key: key, value: value };
        }
        showSaveError(key);
        return null;
      } catch (e) {
        return { key: key, value: value };
      }
    },
    // Legge TUTTE le chiavi in un'unica richiesta di rete (richiede lo script Apps Script aggiornato con ?bulk=1).
    // Ritorna { chiave: valoreGrezzoStringificato, ... } oppure null se non disponibile.
    getBulk: async function () {
      const res = await fetchWithRetry(apiUrl + "?bulk=1", {}, 2);
      if (!res) return null;
      try {
        const json = await res.json();
        if (!json || json.ok !== true || !json.data) return null;
        return json.data;
      } catch (e) {
        return null;
      }
    },
  };

  // --- Fase 3 completa: comunicazione con tutti i fogli "a righe" (Rosa, Amichevoli, RisultatiUfficiali,
  // Voti, Marcatori, VotoSquadra, Convocati, Formazioni, Moduli, Impostazioni). window.storage (sopra)
  // resta definito ma non è più chiamato da nessuna parte del Tracker: nessun blob condiviso residuo. ---
  window.rows = {
    list: async function (sheet) {
      const res = await fetchWithRetry(apiUrl + "?action=list&sheet=" + encodeURIComponent(sheet), {}, 2);
      // null = richiesta fallita (non sappiamo se il foglio è vuoto o no: NON dedurre nulla).
      // [] = richiesta riuscita e il foglio è davvero vuoto.
      if (!res) return null;
      try {
        const data = await res.json();
        if (data && data.ok && Array.isArray(data.rows)) return data.rows;
        return null;
      } catch (e) {
        return null;
      }
    },
    insert: async function (sheet, valori) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "insert", sheet: sheet, valori: valori }),
      }, 3);
      if (!res) { showSaveError(sheet); return null; }
      try {
        const data = await res.json();
        if (data && data.ok) return data.row;
        showSaveError(sheet);
        return null;
      } catch (e) {
        return null;
      }
    },
    upsert: async function (sheet, match, valori) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "upsert", sheet: sheet, match: match, valori: valori }),
      }, 3);
      if (!res) { showSaveError(sheet); return null; }
      try {
        const data = await res.json();
        if (data && data.ok) return data.row;
        showSaveError(sheet);
        return null;
      } catch (e) {
        return null;
      }
    },
    remove: async function (sheet, match) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "delete", sheet: sheet, match: match }),
      }, 3);
      if (!res) { showSaveError(sheet); return false; }
      try {
        const data = await res.json();
        if (!data || !data.ok) showSaveError(sheet);
        return !!(data && data.ok);
      } catch (e) {
        return false;
      }
    },
  };
</script>

const DEFAULT_MODULO = "352";

// Copia i giocatori di "sourceFormazione" negli slot di "targetModuloKey" che hanno lo STESSO id di slot.
// Non inventa posizionamenti: gli slot del modulo di destinazione senza corrispondenza diretta restano vuoti.
// Cognome = ultima parola del nome completo (es. "Nicolò Lodi" -> "Lodi"). Usato sia per l'etichetta
// sotto il pallino sulla mappa formazione, sia come criterio di ordinamento di tutti gli elenchi giocatori.
function lastName(fullName) {
  const parts = (fullName || "").trim().split(/\s+/);
  return parts[parts.length - 1] || "";
}

// Nome di battesimo = prima parola del nome completo (es. "Nicolò Lodi" -> "Nicolò"). Usato dentro il
// pallino sulla mappa formazione, in coppia col cognome mostrato sotto (lastName).
function firstName(fullName) {
  const parts = (fullName || "").trim().split(/\s+/);
  return parts[0] || "";
}

function copyMatchingSlots(sourceFormazione, targetModuloKey) {
  const targetSlots = (FORMATIONS[targetModuloKey] || FORMATIONS[DEFAULT_MODULO]).slots;
  const targetSlotIds = new Set(targetSlots.map((s) => s.id));
  const copied = {};
  Object.keys(sourceFormazione || {}).forEach((slotId) => {
    if (targetSlotIds.has(slotId) && sourceFormazione[slotId]) copied[slotId] = sourceFormazione[slotId];
  });
  return copied;
}

// Numero di sostituzioni = giocatori presenti nell'undici finale (formazione2, esplicito o "a specchio" da
// formazione1 se il modulo coincide) che NON facevano parte dei titolari di formazione1. Limite tecnico noto:
// un doppio cambio sulla stessa maglia (subentrato poi a sua volta sostituito) non viene rilevato, perché il
// Tracker registra solo le due fotografie iniziale/finale, non un log cronologico dei cambi — per questo il
// conteggio va usato come avviso indicativo, mai come blocco.
function countSubstitutions(formazione1, formazione2, modulo1Key, modulo2Key) {
  const mirrorActive = (modulo1Key || DEFAULT_MODULO) === (modulo2Key || DEFAULT_MODULO);
  const starters = new Set(Object.values(formazione1 || {}).filter(Boolean).map(String));
  const slots2 = (FORMATIONS[modulo2Key || DEFAULT_MODULO] || FORMATIONS[DEFAULT_MODULO]).slots;
  const seen = new Set();
  let count = 0;
  slots2.forEach((slot) => {
    const explicit = (formazione2 || {})[slot.id] ? String(formazione2[slot.id]) : "";
    const mirrored = mirrorActive && (formazione1 || {})[slot.id] ? String(formazione1[slot.id]) : "";
    const playerId = explicit || mirrored;
    if (playerId && !seen.has(playerId)) {
      seen.add(playerId);
      if (!starters.has(playerId)) count++;
    }
  });
  return count;
}

function buildRounds() {
  const rounds = [];
  RAW_ROUNDS.forEach((r) => {
    rounds.push({
      key: `${r.g}A`, giornata: r.g, half: "andata", data: r.andata,
      matches: r.pairs.map(([h, a], idx) => ({
        id: `${r.g}A-${idx}`, home: NAME_MAP[h], away: NAME_MAP[a],
      })),
    });
    rounds.push({
      key: `${r.g}R`, giornata: r.g, half: "ritorno", data: r.ritorno,
      matches: r.pairs.map(([h, a], idx) => ({
        id: `${r.g}R-${idx}`, home: NAME_MAP[a], away: NAME_MAP[h],
      })),
    });
  });
  rounds.sort((x, y) => x.data.localeCompare(y.data));
  return rounds;
}

    // Punto 13: le "presenze" non devono dipendere dal fatto che qualcuno abbia scritto un voto — un

    // (chi compare in formazione1 e/o formazione2 di ciascuna partita, sia Cimiano che amichevoli) per
    // contare le presenze effettive, indipendentemente dai voti.
    const presenzeCount = {};
    function addPresence(nome) {
      if (!nome) return;
      presenzeCount[nome] = (presenzeCount[nome] || 0) + 1;
    }
    function playerIdsInMatch(formazione1, formazione2) {
      return new Set([
        ...Object.values(formazione1 || {}).filter(Boolean).map(String),
        ...Object.values(formazione2 || {}).filter(Boolean).map(String),
      ]);

        playerIdsInMatch(det.formazione, det.formazione2).forEach((id) => {

    friendlies.forEach((f) => {

        const player = roster.find((p) => p.id === id);
        if (player) addPresence(player.nome);
      });
    });
    // Ordinati per cognome, come tutti gli altri elenchi giocatori del Tracker (punto 15).
    const names = Array.from(new Set([...roster.map((p) => p.nome), ...Object.keys(map)]))
      .sort((a, b) => lastName(a).localeCompare(lastName(b), "it", { sensitivity: "base" }));
    return names.map((name) => {

      const minuti = entries.map((e) => parseInt(e.minutaggio, 10)).filter((n) => !isNaN(n));

      const presenze = Math.max(entries.length, presenzeCount[name] || 0);
      return { name, entries, presenze, media, minutiTot };

  // --- IMPORT RISULTATI IN BLOCCO (Campionato) ---
  function resolveTeamName(text) {
    const clean = text.trim();
    if (!clean) return null;
    // 1. corrispondenza esatta con il nome canonico
    const exact = TEAMS.find((t) => t.toLowerCase() === clean.toLowerCase());
    if (exact) return exact;
    // 2. corrispondenza con le forme abbreviate del calendario ufficiale
    const mapKey = Object.keys(NAME_MAP).find((k) => k.toLowerCase() === clean.toLowerCase());
    if (mapKey) return NAME_MAP[mapKey];
    // 3. corrispondenza parziale (contiene / è contenuto)
    const partial = TEAMS.find((t) => t.toLowerCase().includes(clean.toLowerCase()) || clean.toLowerCase().includes(t.toLowerCase()));
    if (partial) return partial;
    return null;
  }

  function importBulkResults() {
    const lines = bulkImportText.split("\n").map((l) => l.trim()).filter(Boolean);
    const matched = [];
    const unmatched = [];
    const patch = {};

    lines.forEach((line) => {
      // Formato atteso: "Squadra1 X-Y Squadra2" (o X:Y, o X - Y)
      const m = line.match(/^(.+?)\s+(\d+)\s*[-:]\s*(\d+)\s+(.+)$/);
      if (!m) {
        unmatched.push({ line, motivo: "formato non riconosciuto" });
        return;
      }
      const [, rawHome, golHome, golAway, rawAway] = m;
      const home = resolveTeamName(rawHome);
      const away = resolveTeamName(rawAway);
      if (!home || !away) {
        unmatched.push({ line, motivo: "squadra non riconosciuta" });
        return;
      }
      const fx = round.matches.find(
        (f) => (f.home === home && f.away === away) || (f.home === away && f.away === home)
      );
      if (!fx) {
        unmatched.push({ line, motivo: "nessuna partita corrispondente in questa giornata" });
        return;
      }
      if (fx.home === home) {
        patch[fx.id] = { golHome, golAway };
      } else {
        patch[fx.id] = { golHome: golAway, golAway: golHome };
      }
      matched.push({ line, home, away });
    });

    if (Object.keys(patch).length > 0) {
      setResults((prev) => ({ ...prev, ...patch }));
    }
    setBulkImportResult({ matched, unmatched });
  }

      const list = cur.marcatori || [];
      return { ...prev, [fixtureId]: { ...cur, marcatori: [...list, { id, giocatore: d.giocatore, minuto: d.minuto || "" }] } };
    });

    window.rows.insert("Marcatori", { id, fixtureId, tipo: tipoDaFixtureId(fixtureId), giocatore: d.giocatore, minuto: d.minuto || "" }).catch(() => {});

  // --- SEDE PARTITA (campionato/coppa) ---
  // --- PRESENZE ---
  // --- CONVOCATI (campionato & coppa) ---
  // I "titolari" non sono più un'etichetta separata: chi viene piazzato sul campo (formazione) è titolare,
  // chi resta convocato ma non piazzato è automaticamente panchina.
  function toggleConvocato(fixtureId, playerId) {
    playerId = String(playerId);
    const tipo = tipoDaFixtureId(fixtureId);
    const cur = detailsShared[fixtureId] || {};
    const eraConvocato = !!(cur.convocati || {})[playerId];
    setDetailsShared((prev) => {
      const c = prev[fixtureId] || {};
      const convocati = { ...(c.convocati || {}) };
      const formazione = { ...(c.formazione || {}) };
      const formazione2 = { ...(c.formazione2 || {}) };
      if (convocati[playerId]) {
        delete convocati[playerId];
        // Se non è più convocato, va tolto anche da eventuali posizioni in campo
        Object.keys(formazione).forEach((slotId) => { if (String(formazione[slotId]) === playerId) delete formazione[slotId]; });
        Object.keys(formazione2).forEach((slotId) => { if (String(formazione2[slotId]) === playerId) delete formazione2[slotId]; });
      } else {
        convocati[playerId] = true;
      }
      return { ...prev, [fixtureId]: { ...c, convocati, formazione, formazione2 } };
    });
    if (eraConvocato) {
      Object.keys(cur.formazione || {}).forEach((slotId) => {
        if (String(cur.formazione[slotId]) === playerId) window.rows.remove("Formazioni", { fixtureId, tipo, mappa: "1", slotId }).catch(() => {});
      });
      Object.keys(cur.formazione2 || {}).forEach((slotId) => {
        if (String(cur.formazione2[slotId]) === playerId) window.rows.remove("Formazioni", { fixtureId, tipo, mappa: "2", slotId }).catch(() => {});
      });
      window.rows.remove("Convocati", { fixtureId, tipo, playerId }).catch(() => {});
    } else {
      window.rows.insert("Convocati", { fixtureId, tipo, playerId }).catch(() => {});
    }
  }

  // --- CONVOCATI (amichevoli) ---
  function toggleConvocatoF(friendlyId, playerId) {
    playerId = String(playerId);
    const formazioneCorrente = friendlyFormazione[friendlyId] || {};
    const formazione2Corrente = friendlyFormazione2[friendlyId] || {};
    const eraConvocato = !!(friendlyConvocati[friendlyId] || {})[playerId];
    setFriendlyConvocati((prev) => {
      const cur = { ...(prev[friendlyId] || {}) };
      if (cur[playerId]) delete cur[playerId]; else cur[playerId] = true;
      return { ...prev, [friendlyId]: cur };
    });
    setFriendlyFormazione((prev) => {
      const cur = { ...(prev[friendlyId] || {}) };
      let changed = false;
      Object.keys(cur).forEach((slotId) => { if (String(cur[slotId]) === playerId) { delete cur[slotId]; changed = true; } });
      return changed ? { ...prev, [friendlyId]: cur } : prev;
    });
    setFriendlyFormazione2((prev) => {
      const cur = { ...(prev[friendlyId] || {}) };
      let changed = false;
      Object.keys(cur).forEach((slotId) => { if (String(cur[slotId]) === playerId) { delete cur[slotId]; changed = true; } });
      return changed ? { ...prev, [friendlyId]: cur } : prev;
    });
    if (eraConvocato) {
      Object.keys(formazioneCorrente).forEach((slotId) => {
        if (String(formazioneCorrente[slotId]) === playerId) window.rows.remove("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "1", slotId }).catch(() => {});
      });
      Object.keys(formazione2Corrente).forEach((slotId) => {
        if (String(formazione2Corrente[slotId]) === playerId) window.rows.remove("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2", slotId }).catch(() => {});
      });
      window.rows.remove("Convocati", { fixtureId: friendlyId, tipo: "amichevole", playerId }).catch(() => {});
    } else {
      window.rows.insert("Convocati", { fixtureId: friendlyId, tipo: "amichevole", playerId }).catch(() => {});
    }
  }

  // --- FORMAZIONE (modulo 3-5-2) ---
  // --- FORMAZIONE (modulo 3-5-2) ---
  // Punto 8: finché l'utente non tocca DIRETTAMENTE la mappa 2 (un pallino o il suo modulo), questa resta
  // agganciata alla mappa 1 e viene copiata per davvero (non solo mostrata a video) ad ogni modifica di
  // formazione1/modulo1. Il flag "formazione2Touched" segna il momento dello sgancio: da lì in poi la
  // mappa 2 passa sotto controllo manuale e formazione1 smette di sovrascriverla.
  function setFormazione(fixtureId, slotId, playerId) {
    const tipo = tipoDaFixtureId(fixtureId);
    const cur = detailsShared[fixtureId] || {};
    const mirrorActive = !cur.formazione2Touched;
    setDetailsShared((prev) => {
      const c = prev[fixtureId] || {};
      const formazione = { ...(c.formazione || {}) };
      if (playerId) formazione[slotId] = playerId; else delete formazione[slotId];
      const next = { ...c, formazione };
      if (!c.formazione2Touched) {
        const formazione2 = { ...(c.formazione2 || {}) };
        if (playerId) formazione2[slotId] = playerId; else delete formazione2[slotId];
        next.formazione2 = formazione2;
        next.modulo2 = c.modulo || DEFAULT_MODULO;
      }
      return { ...prev, [fixtureId]: next };
    });
    if (playerId) window.rows.upsert("Formazioni", { fixtureId, tipo, mappa: "1", slotId }, { playerId }).catch(() => {});
    else window.rows.remove("Formazioni", { fixtureId, tipo, mappa: "1", slotId }).catch(() => {});
    if (mirrorActive) {
      if (playerId) window.rows.upsert("Formazioni", { fixtureId, tipo, mappa: "2", slotId }, { playerId }).catch(() => {});
      else window.rows.remove("Formazioni", { fixtureId, tipo, mappa: "2", slotId }).catch(() => {});
      window.rows.upsert("Moduli", { fixtureId, tipo, mappa: "2" }, { modulo: cur.modulo || DEFAULT_MODULO }).catch(() => {});
    }
  }

  function setModulo(fixtureId, modulo) {
    const tipo = tipoDaFixtureId(fixtureId);
    const cur = detailsShared[fixtureId] || {};
    const mirrorActive = !cur.formazione2Touched;
    setDetailsShared((prev) => {
      const c = prev[fixtureId] || {};
      const next = { ...c, modulo };
      if (!c.formazione2Touched) {
        next.modulo2 = modulo;
        next.formazione2 = { ...(c.formazione || {}) }; // stesso modulo => corrispondenza diretta 1:1
      }
      return { ...prev, [fixtureId]: next };
    });
    window.rows.upsert("Moduli", { fixtureId, tipo, mappa: "1" }, { modulo }).catch(() => {});
    if (mirrorActive) {
      window.rows.upsert("Moduli", { fixtureId, tipo, mappa: "2" }, { modulo }).catch(() => {});
      window.rows.remove("Formazioni", { fixtureId, tipo, mappa: "2" }).catch(() => {});
      Object.keys(cur.formazione || {}).forEach((slotId) => {
        window.rows.insert("Formazioni", { fixtureId, tipo, mappa: "2", slotId, playerId: cur.formazione[slotId] }).catch(() => {});
      });
    }
  }

  function setFormazione2(fixtureId, slotId, playerId) {
    const tipo = tipoDaFixtureId(fixtureId);
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      const formazione2 = { ...(cur.formazione2 || {}) };
      if (playerId) formazione2[slotId] = playerId; else delete formazione2[slotId];
      return { ...prev, [fixtureId]: { ...cur, formazione2, formazione2Touched: true } };
    });
    if (playerId) window.rows.upsert("Formazioni", { fixtureId, tipo, mappa: "2", slotId }, { playerId }).catch(() => {});
    else window.rows.remove("Formazioni", { fixtureId, tipo, mappa: "2", slotId }).catch(() => {});
    window.rows.upsert("Impostazioni", { chiave: "formazione2Touched:" + fixtureId }, { valore: "1" }).catch(() => {});
  }

  function setModulo2(fixtureId, modulo) {
    const tipo = tipoDaFixtureId(fixtureId);
    const cur = detailsShared[fixtureId] || {};
    const wasTouched = !!cur.formazione2Touched;
    setDetailsShared((prev) => {
      const c = prev[fixtureId] || {};
      const wt = !!c.formazione2Touched;
      const next = { ...c, modulo2: modulo, formazione2Touched: true };
      if (!wt) {
        // Primo sgancio: prova a ripopolare per davvero con l'undici di INIZIO negli slot compatibili
        // col nuovo modulo, poi da qui in poi la mappa 2 resta sotto controllo manuale dell'utente.
        const copied = copyMatchingSlots(c.formazione, modulo);
        if (Object.keys(copied).length > 0) next.formazione2 = copied;
      }
      return { ...prev, [fixtureId]: next };
    });
    window.rows.upsert("Moduli", { fixtureId, tipo, mappa: "2" }, { modulo }).catch(() => {});
    window.rows.upsert("Impostazioni", { chiave: "formazione2Touched:" + fixtureId }, { valore: "1" }).catch(() => {});
    if (!wasTouched) {
      const copied = copyMatchingSlots(cur.formazione, modulo);
      if (Object.keys(copied).length > 0) {
        window.rows.remove("Formazioni", { fixtureId, tipo, mappa: "2" }).catch(() => {});
        Object.keys(copied).forEach((slotId) => {
          window.rows.insert("Formazioni", { fixtureId, tipo, mappa: "2", slotId, playerId: copied[slotId] }).catch(() => {});
        });
      }
    }
  }

  function setFormazioneF(friendlyId, slotId, playerId) {
    const mirrorActive = !friendlyFormazione2Touched[friendlyId];
    const moduloCorrente = friendlyModulo[friendlyId] || DEFAULT_MODULO;
    setFriendlyFormazione((prev) => {
      const cur = { ...(prev[friendlyId] || {}) };
      if (playerId) cur[slotId] = playerId; else delete cur[slotId];
      return { ...prev, [friendlyId]: cur };
    });
    if (mirrorActive) {
      setFriendlyFormazione2((prev) => {
        const cur2 = { ...(prev[friendlyId] || {}) };
        if (playerId) cur2[slotId] = playerId; else delete cur2[slotId];
        return { ...prev, [friendlyId]: cur2 };
      });
      setFriendlyModulo2State((prev) => ({ ...prev, [friendlyId]: moduloCorrente }));
    }
    if (playerId) window.rows.upsert("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "1", slotId }, { playerId }).catch(() => {});
    else window.rows.remove("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "1", slotId }).catch(() => {});
    if (mirrorActive) {
      if (playerId) window.rows.upsert("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2", slotId }, { playerId }).catch(() => {});
      else window.rows.remove("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2", slotId }).catch(() => {});
      window.rows.upsert("Moduli", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2" }, { modulo: moduloCorrente }).catch(() => {});
    }
  }

  function setModuloF(friendlyId, modulo) {
    const mirrorActive = !friendlyFormazione2Touched[friendlyId];
    const formazione1 = friendlyFormazione[friendlyId] || {};
    setFriendlyModuloState((prev) => ({ ...prev, [friendlyId]: modulo }));
    if (mirrorActive) {
      setFriendlyModulo2State((prev) => ({ ...prev, [friendlyId]: modulo }));
      setFriendlyFormazione2((prev) => ({ ...prev, [friendlyId]: { ...formazione1 } }));
    }
    window.rows.upsert("Moduli", { fixtureId: friendlyId, tipo: "amichevole", mappa: "1" }, { modulo }).catch(() => {});
    if (mirrorActive) {
      window.rows.upsert("Moduli", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2" }, { modulo }).catch(() => {});
      window.rows.remove("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2" }).catch(() => {});
      Object.keys(formazione1).forEach((slotId) => {
        window.rows.insert("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2", slotId, playerId: formazione1[slotId] }).catch(() => {});
      });
    }
  }

  function setFormazioneF2(friendlyId, slotId, playerId) {
    setFriendlyFormazione2((prev) => {
      const cur = { ...(prev[friendlyId] || {}) };
      if (playerId) cur[slotId] = playerId; else delete cur[slotId];
      return { ...prev, [friendlyId]: cur };
    });
    setFriendlyFormazione2Touched((prev) => ({ ...prev, [friendlyId]: true }));
    if (playerId) window.rows.upsert("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2", slotId }, { playerId }).catch(() => {});
    else window.rows.remove("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2", slotId }).catch(() => {});
    window.rows.upsert("Impostazioni", { chiave: "formazione2Touched:" + friendlyId }, { valore: "1" }).catch(() => {});
  }

  function setModuloF2(friendlyId, modulo) {
    const wasTouched = !!friendlyFormazione2Touched[friendlyId];
    const formazione1 = friendlyFormazione[friendlyId] || {};
    setFriendlyModulo2State((prev) => ({ ...prev, [friendlyId]: modulo }));
    setFriendlyFormazione2Touched((prev) => ({ ...prev, [friendlyId]: true }));
    let copied = null;
    if (!wasTouched) {
      copied = copyMatchingSlots(formazione1, modulo);
      setFriendlyFormazione2((prev) => ({ ...prev, [friendlyId]: copied }));
    }
    window.rows.upsert("Moduli", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2" }, { modulo }).catch(() => {});
    window.rows.upsert("Impostazioni", { chiave: "formazione2Touched:" + friendlyId }, { valore: "1" }).catch(() => {});
    if (!wasTouched && copied && Object.keys(copied).length > 0) {
      window.rows.remove("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2" }).catch(() => {});
      Object.keys(copied).forEach((slotId) => {
        window.rows.insert("Formazioni", { fixtureId: friendlyId, tipo: "amichevole", mappa: "2", slotId, playerId: copied[slotId] }).catch(() => {});
      });
    }
  }


  function renderPitch(formazione, onChangeSlot, modulo, onChangeModulo, playerPool, opts) {
    opts = opts || {};
    const compact = !!opts.compact;
    const moduloKey = modulo || DEFAULT_MODULO;
    const slots = FORMATIONS[moduloKey].slots;
    // Punto 16: opzioni della tendina ordinate per cognome, ereditando l'ordine da rosterSorted.
    const poolRoster = rosterSorted.filter((r) => playerPool.includes(String(r.id)));
    // Punto 14: pallini ingranditi del 50% in modalità compact (34px -> 51px); invariati altrove.
    const circleSize = compact ? 51 : 44;
    const labelFont = compact ? 9 : 9;
    const pitchMaxWidth = compact ? "100%" : 320;
    // Valore di ogni slot (sempre dato reale: la mappa 2 ora è una copia scritta per davvero di formazione1,
    // finché l'utente non la tocca — vedi setFormazione/setModulo/setFormazione2/setModulo2), usato per:
    // colore titolare/subentrato ed evitare che lo stesso giocatore compaia in più di uno slot di questa mappa.
    const effectiveBySlot = {};
    slots.forEach((slot) => {
      effectiveBySlot[slot.id] = formazione[slot.id] ? String(formazione[slot.id]) : "";
    });
    const startersIds = opts.startersIds || null;
    // Punto 12: valori dell'ALTRA mappa (stesso concetto di effectiveBySlot ma calcolato altrove in
    // renderDualPitch), usati per escludere dalle opzioni anche chi è già piazzato là, non solo qui.
    const otherEff = opts.otherMapEffective || {};
    // Punto 11: stile leggibile per le <option> della tendina aperta, senza toccare l'aspetto del
    // pallino chiuso (che resta piccolo e colorato, gestito dallo style del <select> stesso).
    const optionStyle = { color: INK, background: "#fff", fontSize: 15 };
    return (
      <div>
        {!compact && (
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            {Object.entries(FORMATIONS).map(([key, f]) => (
              <button key={key} onClick={() => onChangeModulo(key)}
                style={{ fontSize: 11, padding: "4px 10px", borderRadius: 10, border: `1px solid ${LINE}`, background: moduloKey === key ? RED : "#fff", color: moduloKey === key ? "#fff" : INK, cursor: "pointer", fontWeight: 600 }}>
                {f.label}
              </button>
            ))}
          </div>
        )}
        {compact && (
          <select value={moduloKey} onChange={(e) => onChangeModulo(e.target.value)}
            style={{ fontSize: 10, padding: "2px 4px", border: `1px solid ${LINE}`, borderRadius: 4, marginBottom: 6, width: "100%" }}>
            {Object.entries(FORMATIONS).map(([key, f]) => (
              <option key={key} value={key}>{f.label}</option>
            ))}
          </select>
        )}
        {poolRoster.length === 0 && (
          <div style={{ fontSize: 11, color: MUTED, marginBottom: 8 }}>Nessun giocatore disponibile da piazzare qui al momento.</div>
        )}
        <div style={{
          position: "relative", width: "100%", maxWidth: pitchMaxWidth, aspectRatio: "2 / 3", margin: "0 auto",
          background: "linear-gradient(180deg, #3f9142 0%, #368239 100%)", borderRadius: 8, border: `2px solid #2c6b2f`, overflow: "hidden",
        }}>
          {/* linee di campo */}
          <div style={{ position: "absolute", left: "10%", right: "10%", top: "50%", height: 1, background: "rgba(255,255,255,0.5)" }} />
          <div style={{ position: "absolute", left: "50%", top: "50%", width: compact ? 36 : 60, height: compact ? 36 : 60, border: "1px solid rgba(255,255,255,0.5)", borderRadius: "50%", transform: "translate(-50%,-50%)" }} />
          <div style={{ position: "absolute", left: "25%", right: "25%", bottom: 0, height: "14%", border: "1px solid rgba(255,255,255,0.5)", borderTop: "none" }} />
          <div style={{ position: "absolute", left: "25%", right: "25%", top: 0, height: "14%", border: "1px solid rgba(255,255,255,0.5)", borderBottom: "none" }} />
          {slots.map((slot) => {
            const playerId = effectiveBySlot[slot.id];
            const player = roster.find((r) => String(r.id) === playerId);
            const isSub = startersIds ? (!!playerId && !startersIds.has(playerId)) : false;
            const circleColor = isSub ? SUB_COLOR : RED;
            // Punto 12: un giocatore già piazzato in UN ALTRO slot — di QUESTA mappa o dell'ALTRA — non
            // compare più tra le opzioni (resta comunque visibile/selezionabile nello slot dove è già
            // piazzato lui stesso, incluso il proprio slot.id nell'altra mappa: continuità dello stesso
            // titolare che gioca senza cambi).
            const usedElsewhereSameMap = new Set(
              Object.entries(effectiveBySlot).filter(([sId, pId]) => sId !== slot.id && pId).map(([, pId]) => pId)
            );
            const usedElsewhereOtherMap = new Set(
              Object.entries(otherEff).filter(([sId, pId]) => sId !== slot.id && pId).map(([, pId]) => pId)
            );
            const usedElsewhere = new Set([...usedElsewhereSameMap, ...usedElsewhereOtherMap]);
            const optionsForThisSlot = poolRoster.filter((rp) => String(rp.id) === playerId || !usedElsewhere.has(String(rp.id)));
            return (
              <div key={slot.id} style={{ position: "absolute", left: `${slot.x}%`, top: `${slot.y}%`, transform: "translate(-50%,-50%)", textAlign: "center" }}>
                <select value={playerId} onChange={(e) => onChangeSlot(slot.id, e.target.value)}
                  style={{
                    width: circleSize, height: circleSize, borderRadius: "50%", border: `2px solid ${player ? "#fff" : "rgba(255,255,255,0.6)"}`,
                    background: player ? circleColor : "rgba(255,255,255,0.15)", color: "#fff", fontSize: compact ? 8 : 10, fontWeight: 700,
                    textAlign: "center", textAlignLast: "center", cursor: "pointer", appearance: "none", padding: 0,
                  }}>
                  <option value="" style={optionStyle}>{slot.label}</option>
                  {optionsForThisSlot.map((rp) => (
                    <option key={rp.id} value={rp.id} style={optionStyle}>{firstName(rp.nome)}</option>
                  ))}
                </select>
                {player && (
                  <div style={{ fontSize: labelFont, color: "#fff", marginTop: 2, maxWidth: compact ? 62 : 62, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {lastName(player.nome)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function renderDualPitch(formazione1, onChangeSlot1, modulo1, onChangeModulo1, poolIniziale, formazione2, onChangeSlot2, modulo2, onChangeModulo2, convocatiIds, touched) {
    const modulo1Key = modulo1 || DEFAULT_MODULO;
    const modulo2Key = modulo2 || DEFAULT_MODULO;
    // Titolari = tutti i playerId presenti in QUALSIASI slot di formazione1, indipendentemente da slot/modulo:
    // così il colore titolare/subentrato sulla mappa 2 è corretto anche quando i due moduli differiscono.
    const startersIds = new Set(Object.values(formazione1 || {}).filter(Boolean).map(String));
    // Punto 12: valore reale di ogni slot per CIASCUNA mappa, usato per l'esclusione incrociata dentro
    // renderPitch (ogni mappa riceve l'effectiveBySlot dell'ALTRA come opts.otherMapEffective).
    const eff1 = {};
    FORMATIONS[modulo1Key].slots.forEach((s) => { eff1[s.id] = formazione1[s.id] ? String(formazione1[s.id]) : ""; });
    const eff2 = {};
    FORMATIONS[modulo2Key].slots.forEach((s) => { eff2[s.id] = formazione2[s.id] ? String(formazione2[s.id]) : ""; });
    return (
      <div>
        <div style={{ display: "flex", gap: 14, marginBottom: 8, fontSize: 11, color: MUTED }}>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 10, height: 10, borderRadius: "50%", background: RED, display: "inline-block" }} /> Titolare
          </span>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 10, height: 10, borderRadius: "50%", background: SUB_COLOR, display: "inline-block" }} /> Subentrato
          </span>
        </div>
        <div style={{ fontSize: 11, color: MUTED, marginBottom: 8, fontStyle: "italic" }}>
          {touched
            ? "Mappa 2 gestita manualmente: da qui in poi le modifiche a INIZIO non la toccano più."
            : "Mappa 2 agganciata a INIZIO: si aggiorna in automatico finché non la tocchi direttamente."}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 10, color: MUTED, marginBottom: 4, fontWeight: 700, textAlign: "center" }}>INIZIO</div>
            {renderPitch(formazione1, onChangeSlot1, modulo1Key, onChangeModulo1, poolIniziale, { compact: true, otherMapEffective: eff2 })}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 10, color: MUTED, marginBottom: 4, fontWeight: 700, textAlign: "center" }}>CAMBI / FINE</div>
            {renderPitch(formazione2, onChangeSlot2, modulo2Key, onChangeModulo2, convocatiIds, { compact: true, startersIds, otherMapEffective: eff1 })}
          </div>
        </div>
      </div>
    );
  }

  // --- ROSA SQUADRA ---
  function addRosterPlayer() {
    if (!rosterDraft.nome) return;
    const id = Date.now().toString();
    setRoster((prev) => [...prev, { id, nome: rosterDraft.nome }]);
    window.rows.insert("Rosa", { id, nome: rosterDraft.nome }).catch(() => {});
    setRosterDraft({ nome: "" });
  }

  function removeRosterPlayer(id) {
    setRoster((prev) => prev.filter((p) => p.id !== id));
    window.rows.remove("Rosa", { id }).catch(() => {});
  }

  function startEditRoster(p) {
    setEditingRosterId(p.id);
    setRosterDraft({ nome: p.nome });
  }

  function saveEditRoster(id) {
    if (!rosterDraft.nome) return;
    setRoster((prev) => prev.map((p) => (p.id === id ? { ...p, nome: rosterDraft.nome } : p)));
    setEditingRosterId(null);
    window.rows.upsert("Rosa", { id }, { nome: rosterDraft.nome }).catch(() => {});
    setRosterDraft({ nome: "" });
  }



  function addTeamVoto(fixtureId) {
    const d = teamVotoDraft[fixtureId];
    if (!voterName || !d || !d.voto) return;
    const id = Date.now().toString();
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      const list = cur.votoSquadra || [];
      return { ...prev, [fixtureId]: { ...cur, votoSquadra: [...list, { id, autore: voterName, voto: d.voto, nota: d.nota || "" }] } };
    });
    setTeamVotoDraft((prev) => ({ ...prev, [fixtureId]: { voto: "", nota: "" } }));
    window.rows.insert("VotoSquadra", { id, fixtureId, tipo: tipoDaFixtureId(fixtureId), voto: d.voto, nota: d.nota || "", autore: voterName }).catch(() => {});
  }

  function removeTeamVoto(fixtureId, id) {
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      return { ...prev, [fixtureId]: { ...cur, votoSquadra: (cur.votoSquadra || []).filter((v) => v.id !== id) } };
    });
    window.rows.remove("VotoSquadra", { id }).catch(() => {});
  }

  function startEditTeamVoto(fixtureId, v) {
    setEditingTeamVoto(`${fixtureId}:${v.id}`);
    setTeamVotoDraft((prev) => ({ ...prev, [`edit-${fixtureId}`]: { voto: v.voto, nota: v.nota || "" } }));
  }

  function saveEditTeamVoto(fixtureId, id) {
    const d = teamVotoDraft[`edit-${fixtureId}`];
    if (!d || !d.voto) return;
    let autoreRiga = voterName;
    setDetailsShared((prev) => {
      const cur = prev[fixtureId] || {};
      const list = (cur.votoSquadra || []).map((v) => {
        if (v.id !== id) return v;
        autoreRiga = v.autore;
        return { ...v, voto: d.voto, nota: d.nota || "" };
      });
      return { ...prev, [fixtureId]: { ...cur, votoSquadra: list } };
    });
    setEditingTeamVoto(null);
    window.rows.upsert("VotoSquadra", { id }, { fixtureId, tipo: tipoDaFixtureId(fixtureId), voto: d.voto, nota: d.nota || "", autore: autoreRiga }).catch(() => {});
  }

            </table>

            {positionHistory.length > 1 && (
              <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 4, padding: "12px 8px 4px", marginTop: 20 }}>
                <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8, paddingLeft: 8 }}>
                  Andamento classifica Cimiano
                </div>
                <ResponsiveContainer width="100%" height={200}>
                  <LineChart data={positionHistory} margin={{ top: 5, right: 12, left: -18, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={LINE} />
                    <XAxis dataKey="label" tick={{ fontSize: 10, fill: MUTED }} />
                    <YAxis domain={[16, 1]} allowDecimals={false} tick={{ fontSize: 11, fill: MUTED }} />
                    <Tooltip formatter={(v) => [`${v}° posto`, "Classifica"]} />
                    <Line type="monotone" dataKey="posizione" stroke={RED} strokeWidth={2} dot={{ r: 3 }} activeDot={{ r: 5 }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            )}
          </div>
        )}

        {macroTab === "stagione" && stagSub === "cimiano" && (
          <div className="body-font">
            <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
              Aggiungi amichevole
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 6, background: "#fff", padding: 12, borderRadius: 4, border: `1px solid ${LINE}` }}>
              <input placeholder="Avversario" value={fForm.avversario} onChange={(e) => setFForm({ ...fForm, avversario: e.target.value })}
                style={{ flex: 1, minWidth: 140, padding: 6, border: `1px solid ${LINE}` }} />
              <input type="date" value={fForm.data} onChange={(e) => setFForm({ ...fForm, data: e.target.value })}
                style={{ padding: 6, border: `1px solid ${LINE}` }} />
              <input type="time" value={fForm.ora} onChange={(e) => setFForm({ ...fForm, ora: e.target.value })}
                style={{ padding: 6, border: `1px solid ${LINE}` }} />
              <input type="number" placeholder="Gol Cimiano" value={fForm.golCimiano} onChange={(e) => setFForm({ ...fForm, golCimiano: e.target.value })}
                style={{ width: 100, padding: 6, border: `1px solid ${LINE}` }} />
              <span style={{ alignSelf: "center", color: MUTED }}>–</span>
              <input type="number" placeholder="Gol avv." value={fForm.golAvv} onChange={(e) => setFForm({ ...fForm, golAvv: e.target.value })}
                style={{ width: 90, padding: 6, border: `1px solid ${LINE}` }} />
              <button onClick={addFriendly} style={{ background: RED, color: "#fff", border: "none", padding: "6px 16px", borderRadius: 3, fontWeight: 600, cursor: "pointer" }}>
                Aggiungi
              </button>
            </div>
            <div style={{ fontSize: 11, color: MUTED, marginBottom: 20 }}>
              Se la partita non si è ancora giocata, lascia vuoti i gol: comparirà come "in programma" e potrai aggiungere il risultato dopo.
            </div>

            <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
              Tutte le partite
            </div>
            <div style={{ display: "flex", gap: 14, marginBottom: 10, fontSize: 11, color: MUTED, flexWrap: "wrap" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: STATUS_COLORS.played.bg, border: `1px solid ${STATUS_COLORS.played.border}`, display: "inline-block" }} /> giocata
              </span>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: STATUS_COLORS.next.bg, border: `1px solid ${STATUS_COLORS.next.border}`, display: "inline-block" }} /> prossima
              </span>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: STATUS_COLORS.upcoming.bg, border: `1px solid ${STATUS_COLORS.upcoming.border}`, display: "inline-block" }} /> in programma
              </span>
            </div>
            {allCimianoMatches.length === 0 ? (
              <div style={{ color: MUTED, fontSize: 13 }}>Nessuna partita registrata per il Cimiano al momento.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {(() => {
                  let nextAssigned = false;
                  return allCimianoMatches.map((m) => {
                    let isPlayed;
                    if (m.type === "amichevole") {
                      const f = friendlies.find((fr) => fr.id === m.id);
                      isPlayed = f ? (f.golCimiano !== "" && f.golCimiano !== undefined && f.golAvv !== "" && f.golAvv !== undefined) : false;
                    } else {
                      isPlayed = !!results[m.id];
                    }
                    let statusColor;
                    if (isPlayed) {
                      statusColor = "played";
                    } else if (!nextAssigned) {
                      statusColor = "next";
                      nextAssigned = true;
                    } else {
                      statusColor = "upcoming";
                    }

                    if (m.type === "amichevole") {
                      const f = friendlies.find((fr) => fr.id === m.id);
                      return f ? renderFriendlyRow(f, statusColor) : null;
                    }
                    const label = m.type === "coppa"
                      ? `Coppa Lombardia · Girone ${COPPA_GIRONE} · ${fmtDate(m.date)}`
                      : `Campionato · G${m.giornata} ${m.half === "andata" ? "A" : "R"} · ${fmtDate(m.date)}`;
                    return renderCampionatoRow(
                      { id: m.id, home: m.home, away: m.away },
                      label,
                      statusColor
                    );
                  });
                })()}
              </div>
            )}
          </div>
        )}

        {macroTab === "stagione" && stagSub === "giocatori" && (
          <div className="body-font">
            {chartData.length > 1 && (
              <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 4, padding: "12px 8px 4px", marginBottom: 16 }}>
                <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8, paddingLeft: 8 }}>
                  Andamento voti
                </div>
                <ResponsiveContainer width="100%" height={220}>
                  <LineChart data={chartData} margin={{ top: 5, right: 12, left: -18, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={LINE} />
                    <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: MUTED }} />
                    <YAxis domain={[1, 10]} tick={{ fontSize: 11, fill: MUTED }} />
                    <Tooltip labelFormatter={fmtDate} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                    {playersWithData.map((p, i) => (
                      <Line key={p.name} type="monotone" dataKey={p.name} stroke={PLAYER_COLORS[i % PLAYER_COLORS.length]}
                        strokeWidth={2} connectNulls dot={{ r: 3 }} activeDot={{ r: 5 }} />
                    ))}
                  </LineChart>
                </ResponsiveContainer>
              </div>
            )}

            <div style={{ fontSize: 12, color: MUTED, marginBottom: 16 }}>
              Storico voti, minutaggio e commenti per giocatore, dalla partita più recente alla più vecchia.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {playerStats.map((p) => {
                const isOpen = !!expandedPlayer[p.name];
                return (
                  <div key={p.name} style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 4, fontSize: 13 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", flexWrap: "wrap", gap: 6 }}>
                      <div>
                        <strong style={{ fontSize: 15 }}>{p.name}</strong>
                        <div style={{ color: MUTED, fontSize: 12, marginTop: 2 }}>
                          {p.presenze} {p.presenze === 1 ? "presenza" : "presenze"}
                          {p.media !== null && ` · media voto ${p.media.toFixed(1)}`}
                          {p.minutiTot !== null && ` · ${p.minutiTot}' totali`}
                        </div>
                      </div>
                      {p.entries.length > 0 && (
                        <button onClick={() => setExpandedPlayer((prev) => ({ ...prev, [p.name]: !prev[p.name] }))}
                          style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                          {isOpen ? "chiudi storico" : "vedi storico"}
                        </button>
                      )}
                    </div>

                    {isOpen && (
                      <div style={{ borderTop: `1px solid ${LINE}`, padding: "10px 12px" }}>
                        {(() => {
                          const byDate = {};
                          p.entries.forEach((e) => {
                            const voto = parseFloat(e.voto);
                            if (isNaN(voto) || !e.date || e.date === "0000-00-00") return;
                            if (!byDate[e.date]) byDate[e.date] = { sum: 0, count: 0 };
                            byDate[e.date].sum += voto;
                            byDate[e.date].count += 1;
                          });
                          const playerChartData = Object.keys(byDate)
                            .sort((a, b) => a.localeCompare(b))
                            .map((date) => ({ date, voto: byDate[date].sum / byDate[date].count }));
                          if (playerChartData.length < 2) return null;
                          return (
                            <div style={{ marginBottom: 14 }}>
                              <ResponsiveContainer width="100%" height={140}>
                                <LineChart data={playerChartData} margin={{ top: 5, right: 12, left: -28, bottom: 5 }}>
                                  <CartesianGrid strokeDasharray="3 3" stroke={LINE} />
                                  <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 10, fill: MUTED }} />
                                  <YAxis domain={[1, 10]} tick={{ fontSize: 10, fill: MUTED }} />
                                  <Tooltip labelFormatter={fmtDate} formatter={(v) => [v.toFixed(1), "Voto"]} />
                                  <Line type="monotone" dataKey="voto" stroke={RED} strokeWidth={2} dot={{ r: 3 }} activeDot={{ r: 5 }} />
                                </LineChart>
                              </ResponsiveContainer>
                            </div>
                          );
                        })()}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                          {p.entries.map((e, i) => (
                            <div key={i} style={{ borderBottom: i < p.entries.length - 1 ? `1px solid ${LINE}` : "none", paddingBottom: 8 }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
                                <span>
                                  <span style={{ fontSize: 11, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginRight: 6 }}>
                                    {e.tipo === "campionato" ? `G${e.giornata} ${e.half === "andata" ? "A" : "R"}` : "Amichevole"}
                                  </span>
                                  vs <strong>{e.opponent}</strong>
                                  <span style={{ color: MUTED, marginLeft: 6 }}>{e.date && e.date !== "0000-00-00" ? fmtDate(e.date) : ""}</span>
                                </span>
                                <span style={{ fontWeight: 700 }}>
                                  {e.voto}{e.minutaggio ? ` · ${e.minutaggio}'` : ""}
                                </span>
                              </div>
                              {e.nota && <div style={{ color: MUTED, fontSize: 12, fontStyle: "italic", marginTop: 2 }}>{e.nota}</div>}
                              {e.autore && <div style={{ color: MUTED, fontSize: 11, marginTop: 2 }}>votato da {e.autore}</div>}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {macroTab === "stagione" && stagSub === "cannonieri" && (
          <div className="body-font">
            <div style={{ fontSize: 12, color: MUTED, marginBottom: 16 }}>
              Gol segnati in tutte le competizioni: campionato, Coppa Lombardia e amichevoli.
            </div>
            {cannonieri.length === 0 ? (
              <div style={{ color: MUTED, fontSize: 13 }}>Nessun marcatore registrato ancora.</div>
            ) : (
              <table style={{ fontSize: 13, width: "100%" }}>
                <thead>
                  <tr style={{ color: MUTED, fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5 }}>
                    <th style={{ textAlign: "left" }}>#</th><th style={{ textAlign: "left" }}>Giocatore</th><th style={{ textAlign: "center" }}>Gol</th>
                  </tr>
                </thead>
                <tbody>
                  {cannonieri.map((c, i) => (
                    <tr key={c.name} style={{ borderBottom: `1px solid ${LINE}` }}>
                      <td style={{ padding: "8px 0" }}>{i + 1}</td>
                      <td style={{ padding: "8px 0", fontWeight: 600 }}>{c.name}</td>
                      <td style={{ padding: "8px 0", textAlign: "center", fontWeight: 700, color: RED }}>⚽ {c.gol}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        )}

        {macroTab === "stagione" && stagSub === "rosa" && (
          <div className="body-font">
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16, background: "#fff", padding: 12, borderRadius: 4, border: `1px solid ${LINE}` }}>
              <input placeholder="Nome giocatore" value={rosterDraft.nome} onChange={(e) => setRosterDraft((p) => ({ ...p, nome: e.target.value }))}
                style={{ flex: 1, minWidth: 140, padding: 6, border: `1px solid ${LINE}` }} />
              {editingRosterId ? (
                <>
                  <button onClick={() => saveEditRoster(editingRosterId)} style={{ background: RED, color: "#fff", border: "none", padding: "6px 16px", borderRadius: 3, fontWeight: 600, cursor: "pointer" }}>Salva</button>
                  <button onClick={() => { setEditingRosterId(null); setRosterDraft({ nome: "" }); }} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer" }}>annulla</button>
                </>
              ) : (
                <button onClick={addRosterPlayer} style={{ background: RED, color: "#fff", border: "none", padding: "6px 16px", borderRadius: 3, fontWeight: 600, cursor: "pointer" }}>Aggiungi</button>
              )}
            </div>
            <div style={{ fontSize: 11, color: MUTED, marginBottom: 16 }}>
              Tutto qui è condiviso: rosa, voti (con autore e media calcolata automaticamente), marcatori, presenze e formazioni. Chi usa questo tracker vede sempre gli stessi dati.
            </div>
            {roster.length === 0 ? (
              <div style={{ color: MUTED, fontSize: 13 }}>Nessun giocatore in rosa.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {rosterSorted.map((rp) => (
                  <div key={rp.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff", padding: "8px 12px", border: `1px solid ${LINE}`, borderRadius: 4, fontSize: 13 }}>
                    <span>{rp.nome}</span>
                    <span style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => startEditRoster(rp)} style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12 }}>modifica</button>
                      <button onClick={() => removeRosterPlayer(rp.id)} style={{ background: "none", border: "none", color: MUTED, cursor: "pointer", fontSize: 16 }}>×</button>
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {macroTab === "campionato" && campSub === "risultati" && (
          <div className="body-font">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, gap: 8, flexWrap: "wrap" }}>
              <button onClick={() => setRoundIdx((i) => Math.max(0, i - 1))} disabled={roundIdx === 0}
                style={{ padding: "6px 12px", border: `1px solid ${LINE}`, background: "#fff", borderRadius: 3, cursor: "pointer" }}>‹ Prec.</button>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontWeight: 700, fontSize: 16 }}>Giornata {round.giornata} · {round.half === "andata" ? "Andata" : "Ritorno"}</div>
                <div style={{ fontSize: 12, color: MUTED }}>{fmtDate(round.data)}</div>
              </div>
              <button onClick={() => setRoundIdx((i) => Math.min(ROUNDS.length - 1, i + 1))} disabled={roundIdx === ROUNDS.length - 1}
                style={{ padding: "6px 12px", border: `1px solid ${LINE}`, background: "#fff", borderRadius: 3, cursor: "pointer" }}>Succ. ›</button>
            </div>

            <select value={roundIdx} onChange={(e) => setRoundIdx(Number(e.target.value))}
              style={{ width: "100%", padding: 6, border: `1px solid ${LINE}`, marginBottom: 14, borderRadius: 3 }}>
              {ROUNDS.map((r, i) => (
                <option key={r.key} value={i}>
                  Giornata {r.giornata} ({r.half === "andata" ? "A" : "R"}) — {fmtDate(r.data)}
                </option>
              ))}
            </select>

            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {round.matches.map((fx) => renderCampionatoRow(fx))}
            </div>
          </div>
        )}

        {macroTab === "campionato" && campSub === "import" && (
          <div className="body-font">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, gap: 8, flexWrap: "wrap" }}>
              <button onClick={() => setRoundIdx((i) => Math.max(0, i - 1))} disabled={roundIdx === 0}
                style={{ padding: "6px 12px", border: `1px solid ${LINE}`, background: "#fff", borderRadius: 3, cursor: "pointer" }}>‹ Prec.</button>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontWeight: 700, fontSize: 16 }}>Giornata {round.giornata} · {round.half === "andata" ? "Andata" : "Ritorno"}</div>
                <div style={{ fontSize: 12, color: MUTED }}>{fmtDate(round.data)}</div>
              </div>
              <button onClick={() => setRoundIdx((i) => Math.min(ROUNDS.length - 1, i + 1))} disabled={roundIdx === ROUNDS.length - 1}
                style={{ padding: "6px 12px", border: `1px solid ${LINE}`, background: "#fff", borderRadius: 3, cursor: "pointer" }}>Succ. ›</button>
            </div>

            <select value={roundIdx} onChange={(e) => setRoundIdx(Number(e.target.value))}
              style={{ width: "100%", padding: 6, border: `1px solid ${LINE}`, marginBottom: 14, borderRadius: 3 }}>
              {ROUNDS.map((r, i) => (
                <option key={r.key} value={i}>
                  Giornata {r.giornata} ({r.half === "andata" ? "A" : "R"}) — {fmtDate(r.data)}
                </option>
              ))}
            </select>

            <div style={{ fontSize: 12, color: MUTED, marginBottom: 8, lineHeight: 1.5 }}>
              Incolla qui sotto i risultati della giornata selezionata, una partita per riga, nel formato <strong>Squadra1 X-Y Squadra2</strong> (es. <em>Villa 2-1 Enotria 1908</em>). Riconosco anche le sigle usate nel calendario ufficiale (es. "Accademia Inter"). Le righe non riconosciute non vengono toccate — puoi sempre completarle a mano da "Calendario & risultati".
            </div>
            <textarea rows={8} value={bulkImportText} onChange={(e) => setBulkImportText(e.target.value)}
              placeholder={"Villa 2-1 Enotria 1908\nAldini 0-3 Cimiano\n..."}
              style={{ width: "100%", padding: 8, border: `1px solid ${LINE}`, borderRadius: 3, fontFamily: "monospace", fontSize: 12, boxSizing: "border-box", marginBottom: 8 }} />
            <button onClick={importBulkResults} style={{ background: RED, color: "#fff", border: "none", padding: "8px 16px", borderRadius: 3, fontWeight: 600, cursor: "pointer", fontSize: 13 }}>
              Importa risultati
            </button>

            {bulkImportResult && (
              <div style={{ marginTop: 16 }}>
                {bulkImportResult.matched.length > 0 && (
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontWeight: 700, fontSize: 12, color: "#2f855a", marginBottom: 4 }}>
                      ✓ {bulkImportResult.matched.length} risultat{bulkImportResult.matched.length === 1 ? "o" : "i"} importat{bulkImportResult.matched.length === 1 ? "o" : "i"}
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                      {bulkImportResult.matched.map((m, i) => (
                        <div key={i} style={{ fontSize: 12, color: MUTED }}>{m.home} vs {m.away}</div>
                      ))}
                    </div>
                  </div>
                )}
                {bulkImportResult.unmatched.length > 0 && (
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 12, color: RED, marginBottom: 4 }}>
                      ⚠ {bulkImportResult.unmatched.length} rig{bulkImportResult.unmatched.length === 1 ? "a" : "he"} non importat{bulkImportResult.unmatched.length === 1 ? "a" : "e"}
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                      {bulkImportResult.unmatched.map((u, i) => (
                        <div key={i} style={{ fontSize: 12, color: MUTED }}>"{u.line}" — {u.motivo}</div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {macroTab === "coppa" && coppaSub === "classifica" && (
          <div className="body-font">
            <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
              Fase a gironi · Girone {COPPA_GIRONE} · 6-30 settembre 2026
            </div>
            <table style={{ fontSize: 13 }}>
              <thead>
                <tr style={{ color: MUTED, fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5 }}>
                  <th>#</th><th>Squadra</th><th style={{ textAlign: "center" }}>PG</th>
                  <th style={{ textAlign: "center" }}>V</th><th style={{ textAlign: "center" }}>N</th>
                  <th style={{ textAlign: "center" }}>P</th><th style={{ textAlign: "center" }}>GF</th>
                  <th style={{ textAlign: "center" }}>GS</th><th style={{ textAlign: "center" }}>DR</th>
                  <th style={{ textAlign: "center" }}>Pt</th>
                </tr>
              </thead>
              <tbody>
                {coppaStandings.map((s, i) => (
                  <tr key={s.name} style={{ background: s.name === CIMIANO ? "#fdeceb" : "transparent", fontWeight: s.name === CIMIANO ? 700 : 400 }}>
                    <td>{i + 1}</td>
                    <td style={{ color: s.name === CIMIANO ? RED : INK }}>{s.name}</td>
                    <td style={{ textAlign: "center" }}>{s.pg}</td>
                    <td style={{ textAlign: "center" }}>{s.v}</td>
                    <td style={{ textAlign: "center" }}>{s.n}</td>
                    <td style={{ textAlign: "center" }}>{s.p}</td>
                    <td style={{ textAlign: "center" }}>{s.gf}</td>
                    <td style={{ textAlign: "center" }}>{s.gs}</td>
                    <td style={{ textAlign: "center" }}>{s.gf - s.gs > 0 ? "+" : ""}{s.gf - s.gs}</td>
                    <td style={{ textAlign: "center", fontWeight: 700 }}>{s.pt}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {macroTab === "coppa" && coppaSub === "risultati" && (
          <div className="body-font">
            <div style={{ fontWeight: 700, fontSize: 12, color: MUTED, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
              Fase a gironi · Girone {COPPA_GIRONE} · 6-30 settembre 2026
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {COPPA_FIXTURES.map((fx) => renderCampionatoRow(fx, `${fmtDate(fx.data)} ore ${fx.ora}`))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("app-root"));
root.render(<GironeATracker />);

</script>
</body>
</html>
